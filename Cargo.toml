[package]
name    = "tveru"
version = "0.3.0"
edition = "2024"

authors     = ["Michimoto Katase <mkatase@gmail.com>"]
license     = "MIT"
description = "A lightweight, keyboard-driven TVer drama aggregator and streaming CLI utility."
repository  = "https://github.com/mkatase/tveru"
readme      = "README.md"

[dependencies]
clap       = { version = "4.6.10", features = ["derive"] }
colored    = "3.1.1"
indicatif  = "0.18.6"
jiff       = { version = "1.0.3", features = ["serde"] }
regex      = "1.13.2"
serde      = { version = "1.0.229" , features = ["derive"] }
serde_json = "1.0.154"
thirtyfour = "0.38.3"
tokio      = { version = "1.54.1", features = ["full"] }
